# ── Prod VM Docker Compose ──────────────────────────────────
# Run ./start.sh to generate config templates and start containers.

services:
  # ── PostgreSQL ──────────────────────────────────────────
  pg:
    build:
      context: ./pg
      dockerfile: Dockerfile
    container_name: pg-prod
    hostname: pg-prod
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGBACKREST_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:-changeme}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: >
      postgres
      -c archive_mode=on
      -c archive_command='pgbackrest --stanza=${MY_STANZA:-pg-prod} archive-push %p'
      -c wal_level=replica
      -c archive_timeout=${ARCHIVE_TIMEOUT:-60}
      -c restore_command='pgbackrest --stanza=${REMOTE_STANZA:-pg-reserve} archive-get %f "%p"'
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./pg-socket:/var/run/postgresql
      - ./configs/pg-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./pgbackrest-spool:/var/spool/pgbackrest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backup Scheduler (active VM only) ───────────────────
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: prod-cron-backup
    environment:
      MY_STANZA: ${MY_STANZA:-pg-prod}
      PGBACKREST_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:-changeme}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BACKUP_FULL_CRON: ${BACKUP_FULL_CRON:-}
      BACKUP_DIFF_CRON: ${BACKUP_DIFF_CRON:-}
      BACKUP_CHECK_CRON: ${BACKUP_CHECK_CRON:-}
    volumes:
      - ./pg-data:/var/lib/postgresql/data:ro
      - ./pg-socket:/var/run/postgresql
      - ./configs/backup-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    restart: unless-stopped

  # ── Restore Scheduler (standby VM only) ─────────────────
  restore:
    build:
      context: ./restore
      dockerfile: Dockerfile
    container_name: prod-cron-restore
    environment:
      MY_STANZA: ${MY_STANZA:-pg-prod}
      REMOTE_STANZA: ${REMOTE_STANZA:-pg-reserve}
      PGBACKREST_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:-changeme}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      PG_CONTAINER: pg-prod
      DATA_DIR: /var/lib/postgresql/data
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./pg-socket:/var/run/postgresql
      - ./configs/restore-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
