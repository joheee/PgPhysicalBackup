# ── Single-PG pgBackRest → S3 deployment ──────────────────
# Run ./start.sh to generate configs, build images, and start containers.
# Run ./restore.sh on a fresh host to recover from the latest backup.

services:
  # ── PostgreSQL (archives WAL to S3) ─────────────────────
  pg:
    build:
      context: ./pg
      dockerfile: Dockerfile
    container_name: pg
    hostname: pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGBACKREST_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:-changeme}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: >
      postgres
      -c archive_mode=on
      -c archive_command='pgbackrest --stanza=${STANZA:-pg} archive-push %p'
      -c wal_level=replica
      -c archive_timeout=${ARCHIVE_TIMEOUT:-60}
      -c restore_command='pgbackrest --stanza=${STANZA:-pg} archive-get %f "%p"'
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./pg-socket:/var/run/postgresql
      - ./configs/pg-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./pgbackrest-spool:/var/spool/pgbackrest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backup Scheduler (cron: full / diff / check) ────────
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: pg-cron-backup
    environment:
      STANZA: ${STANZA:-pg}
      PGBACKREST_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:-changeme}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BACKUP_FULL_CRON: ${BACKUP_FULL_CRON:-}
      BACKUP_DIFF_CRON: ${BACKUP_DIFF_CRON:-}
      BACKUP_CHECK_CRON: ${BACKUP_CHECK_CRON:-}
    volumes:
      - ./pg-data:/var/lib/postgresql/data:ro
      - ./pg-socket:/var/run/postgresql
      - ./configs/backup-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    restart: unless-stopped
