# ── Single-PG pgBackRest → S3 deployment ──────────────────
# Run ./start.sh to generate configs, build images, and start containers.
# Run ./restore.sh on a fresh host to recover from the latest backup.

services:
  # ── PostgreSQL (archives WAL to S3) ─────────────────────
  pg:
    build:
      context: ./pg
      dockerfile: Dockerfile
    container_name: pg
    hostname: pg
    ports:
      # Localhost only. Put a reverse proxy or SSH tunnel in front for remote access.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Data checksums let pgBackRest verify every page during backup.
      # Only applies when initdb runs, i.e. a new pg-data.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # pgBackRest does not expand ${VAR} in its config, so the passphrase comes in
      # as a PGBACKREST_REPO1_* option.
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS in .env}
    # S3 keys (PGBACKREST_REPO1_S3_KEY / _SECRET) are written by start.sh to a
    # mode-600 file only when static keys are set. pgBackRest rejects empty values,
    # so on EC2 (instance profile) the file is absent and the variables stay unset.
    env_file:
      - path: ./configs/s3-keys.env
        required: false
    command: >
      postgres
      -c archive_mode=on
      -c archive_command='pgbackrest --stanza=${PGBACKREST_STANZA:-pg} archive-push %p'
      -c wal_level=replica
      -c archive_timeout=${PGBACKREST_ARCHIVE_TIMEOUT:-60}
      -c restore_command='pgbackrest --stanza=${PGBACKREST_STANZA:-pg} archive-get %f "%p"'
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./pg-socket:/var/run/postgresql
      - ./configs/pg-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./pgbackrest-spool:/var/spool/pgbackrest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backup Scheduler (cron: full / diff / check) ────────
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: pg-cron-backup
    environment:
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:-pg}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS in .env}
      PGBACKREST_BACKUP_FULL_CRON: ${PGBACKREST_BACKUP_FULL_CRON:-}
      PGBACKREST_BACKUP_DIFF_CRON: ${PGBACKREST_BACKUP_DIFF_CRON:-}
      PGBACKREST_BACKUP_CHECK_CRON: ${PGBACKREST_BACKUP_CHECK_CRON:-}
      # Alerting (all optional): webhook on failure, dead-man's switch ping on success.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEALTHCHECK_URL_FULL: ${HEALTHCHECK_URL_FULL:-}
      HEALTHCHECK_URL_DIFF: ${HEALTHCHECK_URL_DIFF:-}
      HEALTHCHECK_URL_CHECK: ${HEALTHCHECK_URL_CHECK:-}
    env_file:
      - path: ./configs/s3-keys.env
        required: false
    volumes:
      - ./pg-data:/var/lib/postgresql/data:ro
      - ./pg-socket:/var/run/postgresql
      - ./configs/backup-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    restart: unless-stopped

  # ── pgAdmin (web UI, optional) ──────────────────────────
  # Off by default. Start with: docker compose --profile pgadmin up -d pgadmin
  pgadmin:
    profiles: ["pgadmin"]
    image: dpage/pgadmin4:9.9
    container_name: pgadmin
    ports:
      - "127.0.0.1:5435:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@test.com}
      # No default: pgAdmin refuses to start until you set one in .env.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
