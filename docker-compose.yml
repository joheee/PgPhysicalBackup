# ── Single-PG pgBackRest → S3 deployment ──────────────────
# Run ./start.sh to generate configs, build images, and start containers.
# Run ./restore.sh on a fresh host to recover from the latest backup.
name: pgdemo

services:
  # ── PostgreSQL (archives WAL to S3) ─────────────────────
  pg:
    build:
      context: ./pg
      dockerfile: Dockerfile
    container_name: pg
    hostname: pg
    ports:
      # Localhost only. Put a reverse proxy or SSH tunnel in front for remote access.
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Data checksums let pgBackRest verify every page during backup.
      # Only applies when initdb runs, i.e. a new pg-data.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # pgBackRest does not expand ${VAR} in its config, so the passphrase comes in
      # as a PGBACKREST_REPO1_* option.
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS in .env}
    # S3 keys (PGBACKREST_REPO1_S3_KEY / _SECRET) are written by start.sh to a
    # mode-600 file only when static keys are set. pgBackRest rejects empty values,
    # so on EC2 (instance profile) the file is absent and the variables stay unset.
    env_file:
      - path: ./configs/s3-keys.env
        required: false
    command: >
      postgres
      -c archive_mode=on
      -c archive_command='pgbackrest --stanza=${PGBACKREST_STANZA:-pg} archive-push %p'
      -c wal_level=replica
      -c archive_timeout=${PGBACKREST_ARCHIVE_TIMEOUT:-60}
      -c restore_command='pgbackrest --stanza=${PGBACKREST_STANZA:-pg} archive-get %f "%p"'
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./pg-socket:/var/run/postgresql
      - ./configs/pg-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./pgbackrest-spool:/var/spool/pgbackrest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backup Scheduler (cron: full / diff / check) ────────
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: pg-cron-backup
    environment:
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:-pg}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS in .env}
      PGBACKREST_BACKUP_FULL_CRON: ${PGBACKREST_BACKUP_FULL_CRON:-}
      PGBACKREST_BACKUP_DIFF_CRON: ${PGBACKREST_BACKUP_DIFF_CRON:-}
      PGBACKREST_BACKUP_CHECK_CRON: ${PGBACKREST_BACKUP_CHECK_CRON:-}
      # Alerting (all optional): webhook on failure, dead-man's switch ping on success.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEALTHCHECK_URL_FULL: ${HEALTHCHECK_URL_FULL:-}
      HEALTHCHECK_URL_DIFF: ${HEALTHCHECK_URL_DIFF:-}
      HEALTHCHECK_URL_CHECK: ${HEALTHCHECK_URL_CHECK:-}
      # Seconds between countdown lines in docker logs (0 = off). 1 writes about 12 MB a day.
      COUNTDOWN_INTERVAL_SECONDS: ${COUNTDOWN_INTERVAL_SECONDS:-1}
    # Log rotation. Docker can only rotate by SIZE, not by time, so the size is picked
    # to match the countdown: 1 line/s x 148 B = 12.2 MiB a day, so a 37m file fills in
    # about 3 days, then Docker starts a new file and compresses the old one (about 35x
    # smaller). With max-file 2 you keep the current file plus the previous one, so
    # 3 to 6 days of history. Disk use peaks at about 38 MiB. If you change
    # COUNTDOWN_INTERVAL_SECONDS, change max-size in proportion (e.g. interval 10 -> 370m).
    logging:
      driver: local
      options:
        max-size: "37m"
        max-file: "2"
    env_file:
      - path: ./configs/s3-keys.env
        required: false
    volumes:
      - ./pg-data:/var/lib/postgresql/data:ro
      - ./pg-socket:/var/run/postgresql
      - ./configs/backup-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    restart: unless-stopped

  # ── Restore (throwaway: restore from S3, check, report, exit) ──
  # Run on demand: docker compose run --rm restore   (see the README "Restore container")
  # It never mounts pg-data. It restores into its own named volume, which must be
  # empty, starts Postgres with archive_mode=off on a unix socket only, and exits.
  restore:
    profiles: ["restore"]
    build:
      context: ./restore
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:-pg}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS in .env}
      # Parallel S3 downloads. pgBackRest fetches every file with its own request, so
      # one worker restores only ~3 files/s from a far-away region.
      PGBACKREST_PROCESS_MAX: ${PGBACKREST_PROCESS_MAX:-4}
      # Scenario knobs (all optional, see restore/entrypoint.sh)
      RESTORE_TYPE: ${RESTORE_TYPE:-}
      RESTORE_TARGET: ${RESTORE_TARGET:-}
      RESTORE_SET: ${RESTORE_SET:-}
      RESTORE_DB_INCLUDE: ${RESTORE_DB_INCLUDE:-}
      RESTORE_DELTA: ${RESTORE_DELTA:-0}
      RESTORE_KEEP: ${RESTORE_KEEP:-0}
      RESTORE_VERIFY: ${RESTORE_VERIFY:-0}
    env_file:
      - path: ./configs/s3-keys.env
        required: false
    volumes:
      - ./configs/pg-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # The drill points this at its own volume (RESTORE_DATA_VOLUME=drill-restore-data).
      - ${RESTORE_DATA_VOLUME:-restore-data}:/var/lib/postgresql/data
      - ./reports:/reports

  # ── Drill source (throwaway, started and removed by drill/run.sh) ──
  # A second Postgres that archives to its own stanza under drill/<run-id>/ with a
  # random passphrase, so the drill never touches pg, pg-data or the real stanza.
  # No ports. Every DRILL_* value is set by drill/run.sh.
  drill-source:
    profiles: ["drill"]
    build:
      context: ./pg
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      # Only reachable through the unix socket inside the container.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGBACKREST_REPO1_PATH: ${DRILL_REPO_PATH:-/drill/unset}
      PGBACKREST_REPO1_CIPHER_PASS: ${DRILL_CIPHER_PASS:-}
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_REPO1_RETENTION_FULL: "2"
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_START_FAST: "y"
      PGBACKREST_PROCESS_MAX: ${PGBACKREST_PROCESS_MAX:-4}
    env_file:
      - path: ./configs/s3-keys.env
        required: false
    command: >
      postgres
      -c archive_mode=on
      -c archive_command='pgbackrest --stanza=drill archive-push %p'
      -c wal_level=replica
      -c archive_timeout=${DRILL_ARCHIVE_TIMEOUT:-10}
      -c listen_addresses=''
    volumes:
      - drill-source-data:/var/lib/postgresql/data
      - drill-socket:/var/run/postgresql
      - ./configs/pg-pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

  # Stand-in for the alert webhook and the dead-man's switch in the failure scenario.
  # Compose network only, no ports.
  drill-listener:
    profiles: ["drill"]
    image: python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca
    command: ["python3", "-u", "/listener.py"]
    volumes:
      - ./drill/listener.py:/listener.py:ro

  # ── pgAdmin (web UI, optional) ──────────────────────────
  # Off by default. Start with: docker compose --profile pgadmin up -d pgadmin
  pgadmin:
    profiles: ["pgadmin"]
    image: dpage/pgadmin4:9.9
    container_name: pgadmin
    ports:
      - "127.0.0.1:5435:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@test.com}
      # No default: pgAdmin refuses to start until you set one in .env.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy

volumes:
  # Target of the restore container. Empty between runs (the container clears it).
  restore-data:
  # Drill-only volumes: created by drill/run.sh and removed when it ends (--keep keeps them).
  drill-restore-data:
  drill-source-data:
  drill-socket:
